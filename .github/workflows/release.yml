name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build reproducible release artifacts
        env:
          SOURCE_DATE_EPOCH: "0"
        run: sh scripts/release.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}" dist
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: vps-status-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
