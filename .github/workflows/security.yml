name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --dir web install --frozen-lockfile
      - name: Go vulnerability database
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Production web dependencies
        run: pnpm --dir web audit --prod
      - name: Filesystem and configuration scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        run: docker build -f deploy/Dockerfile -t vps-status-control:scan .
      - name: Scan production image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vps-status-control:scan
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
